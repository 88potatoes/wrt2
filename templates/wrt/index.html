<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item" style="color: #58a1ef; font-weight: bold;">Home</a>
                <a href="/about" class="navbar-item">About Us</a>
                <a href="api/search-page/" class="navbar-item">Search</a>
            </div>
            <div class="navbar-end">
                <a href="#" id="logoutLink" class="navbar-item">Logout</a>
                <a href="/login" id="loginLink" class="navbar-item">Login</a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container has-text-centered">
            <h1 class="title">aur ehm gee</h1>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const accessToken = localStorage.getItem('access_token');
            const loginLink = document.getElementById('loginLink');
            const logoutLink = document.getElementById('logoutLink');
    
            // If user has an access token, show logout and hide login
            if (accessToken) {
                loginLink.style.display = 'none';
                logoutLink.style.display = 'block';
            } else {
                loginLink.style.display = 'block';
                logoutLink.style.display = 'none';
            }
    
            // Logout logic
            logoutLink.addEventListener('click', function(event) {
                event.preventDefault();
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/';  // Redirect to home page after logout
            });
        });
    </script>
    
</body>
</html>
