{% extends "base.html" %}
{% load static %}

{% block title %} Search {% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/search.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<!-- probably don't need to load in all the icons -->
{% endblock %}
{% block content %}
{% include "partials/navbar.html" %}

<div id="brokenLinksTab" class="tab-content">
    <h2 class="tab-title">Broken Link Search</h2>
    <div class="columns-is-centered">
        <div class="column is-8">
            <form id="crawlForm">
                {% csrf_token %}
                <input type="hidden" name="form_type" value="search_term_form">

                <div class="field">
                    <label class="label">Root URLs
                        <span class="icon has-tooltip" id="tooltipIcon3">
                            <i class="fas fa-info-circle"></i>
                            <div class="tooltip">This tool scans a website for broken links and pages that require
                                login access, like those using Okta. It checks the seed URLs and all the
                                internal links with the same prefix URL.
                            </div>
                        </span>
                    </label>
                    <div id="crawlUrlInputContainer">
                        <div class="control">
                            <input class="input" type="text" name="starting_links[]"
                                placeholder="Enter a URL defining the search range..." required>
                        </div>
                    </div>
                    <div>
                        <button id="addCrawlInputBtn" type="button" class="button is-link is-light"
                            style="margin-top: 10px;">Add URL</button>
                    </div>
                    <div class="field"></div>
                    <div class="control">
                        <button class="button is-link" type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="searchResultsContainer" class="container" style="margin-top: 20px;">
            <div id="crawlResults">
                <!-- Results will be displayed here after search -->
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
<script>

    // Handle CrawlForm submission
    const crawlForm = document.getElementById('crawlForm');
    const crawlResultsDiv = document.getElementById('crawlResults');

    crawlForm.addEventListener('submit', function (event) {
        event.preventDefault();
        const formData = new FormData(crawlForm);
        const starting_links = formData.getAll('starting_links[]');
        const browser_info = navigator.userAgent;

        crawlResultsDiv.innerHTML = `<p>Scraping in progress... Please wait.</p>`;

        // Debug
        console.log("Starting Links: ", starting_links);

        fetch("{% url 'crawl_broken_links' %}", {
            method: "POST",
            headers: {
                'Content-Type': "application/json",
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                starting_links,
                browser_info
            })
        })

            .then(response => response.json())
            .then((data) => {
                console.log("data: " + data);
                const crawlResultsDiv = document.getElementById('crawlResults');

                const searchStrWebpages = data.search_str_webpages;
                const brokenLinks = data.broken_links;
                const requiresAccess = data.requires_access;
                const output = data.output;

                if (brokenLinks.length > 0) {
                    // Clears previous results
                    crawlResultsDiv.innerHTML = '';

                    const resultsHeaderDiv = document.createElement('div');
                    resultsHeaderDiv.classList.add('table-header');

                    const resultsTitle = document.createElement('h2');
                    resultsTitle.id = 'resultsTable'
                    resultsTitle.classList.add('results');
                    resultsTitle.textContent = 'Results - Broken Links';
                    resultsHeaderDiv.appendChild(resultsTitle);

                    // create buttons div
                    const buttonsDiv = document.createElement('div');
                    buttonsDiv.classList.add('button-group');

                    // Create export buttons
                    const buttons = createExportButtons(searchStrWebpages, brokenLinks, requiresAccess, 'broken_links');
                    console.log("Search Results:", searchStrWebpages);
                    console.log("Broken Links:", brokenLinks);
                    console.log("Access Required Links:", requiresAccess);

                    // Append buttons to the export buttons div
                    buttonsDiv.appendChild(buttons[0]);
                    buttonsDiv.appendChild(buttons[1]);
                    console.log('Buttons added to the buttons div');

                    resultsHeaderDiv.appendChild(buttonsDiv);

                    crawlResultsDiv.appendChild(resultsHeaderDiv);

                    const table = document.createElement('table');
                    table.classList.add('table', 'is-bordered', 'is-fullwidth', 'is-hoverable');
                    table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Broken Link</th>
                            <th>Origin Page URL</th>
                        </tr>
                    </thead>
                `;

                    const tableBody = document.createElement('tbody');

                    // TODO 
                    brokenLinks.forEach(result => {
                        const [URL, origin] = result;
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><a href="${URL}" target="_blank">${URL}</a></td>
                            <td><a href="${origin}" target="_blank">${origin}</a></td>
                        `;

                        tableBody.appendChild(row);
                    });

                    table.appendChild(tableBody);
                    crawlResultsDiv.appendChild(table);

                } else if (brokenLinks.length == 0) {
                    crawlResultsDiv.innerHTML = '';

                    const resultsDiv = document.createElement('h3');
                    resultsDiv.textContent = 'No broken links found!';
                    crawlResultsDiv.appendChild(resultsDiv);

                } else if (data.status) {
                    crawlResultsDiv.innerHTML = `<p>${data.status}</p>`;
                }
            });
    });

    // Handle adding input fields for Crawl Form
    const addCrawlInputBtn = document.getElementById('addCrawlInputBtn');
    const crawlUrlInputContainer = document.getElementById('crawlUrlInputContainer');

    addCrawlInputBtn.addEventListener('click', function () {
        const newFieldDiv = document.createElement('div');
        newFieldDiv.classList.add('control');
        newFieldDiv.style.marginTop = '10px';

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = "X";
        deleteBtn.classList.add("delete-btn");
        deleteBtn.addEventListener('click', () => {
            newFieldDiv.remove();
        })

        newFieldDiv.innerHTML = `
        <input class="input" type="text" name="starting_links[]" placeholder="Enter a URL defining the search range...">
        `;
        newFieldDiv.appendChild(deleteBtn);
        crawlUrlInputContainer.appendChild(newFieldDiv);
    });
</script>
{% endblock %}
