<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item">Home</a>
                <a href="/about" class="navbar-item">About Us</a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Welcome to the Protected Page!</h1>
            <p class="has-text-centered">Only authenticated users can access this page.</p>
        </div>
    </section>

    <script>
        // Check if access token is present
        const accessToken = localStorage.getItem('access_token');
        
        if (!accessToken) {
            // Redirect to login if not authenticated
            window.location.href = "/";
        } 
    </script>

    <script>
        navigator.sayswho = (function() {
            var N = navigator.appName, ua = navigator.userAgent, tem;
            var M = ua.match(/(opera|chrome|safari|firefox|msie|trident)\/?\s*([\d\.]+)/i);
            if (M && (tem = ua.match(/version\/([\.\d]+)/i)) != null) M[2] = tem[1];
            M = M ? [M[1], M[2]] : [N, navigator.appVersion, '-?'];
            return M.join(' ');
        })();
        
        // Print in the console
        console.log("Browser detected:", navigator.sayswho);
    </script>
</body>
</html>
