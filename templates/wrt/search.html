<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item">Home</a>
                <a href="/about" class="navbar-item">About Us</a>
                <a href="/search" class="navbar-item" style="color: #58a1ef; font-weight: bold;">Search</a>
            </div>
            <div class="navbar-end">
                {% if user.is_authenticated %}
                    <a href="/logout" class="navbar-item">Logout</a>
                {% else %}
                    <a href="/login" class="navbar-item">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Search</h1>
            <div class="columns is-centered">
                <div class="column is-8">
                    <form action="{% url 'search' %}" method="POST">
                        {% csrf_token %}
                        <div class="field">
                            <label class="label">Search Term</label>
                            <div class="control">
                                <input class="input" type="text" name="searchterm" placeholder="Enter your search term...">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Website Range</label>
                            <div class="control">
                                <input class="input" type="text" name="websites" placeholder="Enter a URL defining the search range..." required>
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-link" type="submit">Search</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
