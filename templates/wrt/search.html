{% extends "base.html" %}
{% load static %}

{% block title %} Search {% endblock %}

{% block head %} 
    <link rel="stylesheet" href="{% static 'css/search.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- probably don't need to load in all the icons -->
{% endblock %}

{% block content %} 
    {% include "partials/navbar.html" %}

    <div id="searchTermTab" class="tab-content">
        <h2 class="tab-title">String Search</h2>
        <div class="columns-is-centered">
            <div class="column is-8">
                <form id="searchForm">
                    {% csrf_token %}
                    <input type="hidden" name="form_type" value="search_term_form">

                    <div class="field">
                        <label class="label">Search Term
                            <span class="icon has-tooltip" id="tooltipIcon1">
                                <i class="fas fa-info-circle"></i>
                                <div class="tooltip">
                                    <ul>
                                        <li>?: Represents a single wildcard character</li>
                                        <li>%: Acts as a wildcard for 0 or more characters</li>
                                        <li>[a|b|c]: Any of the options can be matched, including % and ? wildcards</li>
                                    </ul>
                                </div>
                            </span>
                        </label>
                        <div class="control">
                            <input class="input" type="text" name="search_text" placeholder="Enter your search term...">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">Website Range
                            <span class="icon has-tooltip" id="tooltipIcon2">
                                <i class="fas fa-info-circle"></i>
                                <div class="tooltip">
                                    This website crawl starts at
                                    these seed URLs,
                                    scraping the text for the target string and then follows any links that lead
                                    to
                                    other pages within the same site.
                                </div>
                            </span>
                        </label>
                        <div id="searchUrlInputContainer">
                            <div class="control">
                                <input class="input" type="text" name="starting_links[]"
                                    placeholder="Enter a URL defining the search range..." required></input>
                            </div>
                        </div>
                        <button id="addSearchInputBtn" type="button" class="button is-link is-light"
                            style="margin-top: 10px;">Add URL</button>
                    </div>

                    <div class="field">
                        <div class="control">
                            <button class="button is-link" type="submit">Search</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div id="searchResultsContainer" class="container" style="margin-top: 20px;">
            <div id="searchResults">
                <!-- Results will be displayed here after search -->
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
<script>
    const searchForm = document.getElementById('searchForm');
    searchForm.addEventListener('submit', function (event) {
        event.preventDefault(); // Prevent the default form submission

        const formData = new FormData(searchForm);
        const searchText = formData.get('search_text');
        const startingLinks = formData.getAll('starting_links[]'); // Ensure you're getting the right input
        const browserInfo = navigator.userAgent; // Use userAgent to get browser info

        fetch("{% url 'search_term' %}", {
            method: "POST", // Specify the method here
            headers: {
                'Content-Type': 'application/json', // Set the content type
                'X-CSRFToken': '{{ csrf_token }}'  // Include CSRF token for security
            },
            body: JSON.stringify({
                search_text: searchText,
                starting_links: startingLinks, // Sending as an array
                browser_info: browserInfo
            })
        })
        .then(res => {
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }
            return res.json(); // Call .json() method to parse response
        })
        .then(data => {
            console.log("Data received from the server:", data);
            const searchResultsDiv = document.getElementById('searchResults');

            if (data.length > 0 && data[0].length > 0) {
                // clears previous results
                searchResultsDiv.innerHTML = '';

                const resultsHeaderDiv = document.createElement('div');
                resultsHeaderDiv.classList.add('table-header');

                const resultsTitle = document.createElement('h2');
                resultsTitle.id = 'resultsTable'
                resultsTitle.classList.add('results');
                resultsTitle.textContent = 'Results - Strings Matched';
                resultsHeaderDiv.appendChild(resultsTitle);

                // create buttons div
                const buttonsDiv = document.createElement('div');
                buttonsDiv.classList.add('button-group');

                // Create export buttons
                const buttons = createExportButtons(data[0], data[1], data[2], 'search_term');
                console.log("Search Results:", data[0]);
                console.log("Broken Links:", data[1]);
                console.log("Access Required Links:", data[2]);

                // Append buttons to the export buttons div
                buttonsDiv.appendChild(buttons[0]);
                buttonsDiv.appendChild(buttons[1]);
                console.log('Buttons added to the buttons div');

                resultsHeaderDiv.appendChild(buttonsDiv);

                searchResultsDiv.appendChild(resultsHeaderDiv);

                const table = document.createElement('table');
                table.classList.add('table', 'is-bordered', 'is-fullwidth', 'is-hoverable');
                table.innerHTML = `
                    <thead>
                        <tr>
                            <th>Matched String</th>
                            <th>Page URL</th>
                        </tr>
                        <tr class="urlRange">
                            <th colspan="2">Results for Website Range "${startingLinks[0]}"</th>
                        </tr>
                    </thead>
                `;

                const tableBody = document.createElement('tbody');
                data[0].forEach(result => {
                    const [searchTerm, link] = result;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${searchTerm}</td>
                        <td><a href="${link}" target="_blank">${link}</a></td>
                    `;
                    tableBody.appendChild(row);
                });

                console.log('Table of Results shown');

                table.appendChild(tableBody);
                searchResultsDiv.appendChild(table);


            } else if (data[0].length == 0) {
                if (data[1].length > 0 || data[2].length > 0) {
                    // Call the export buttons functionality
                    const buttons = createExportButtons(data[0], data[1], data[2]);
                    const exportButtonsDiv = document.getElementById('exportButtons');
                    exportButtonsDiv.innerHTML = '';
                    exportButtonsDiv.appendChild(buttons[0]);
                    exportButtonsDiv.appendChild(buttons[1]);

                    searchResultsDiv.innerHTML = `
                    <p>No match found, broken/access required links encountered!</p>
                    `;
                }
                else {
                    searchResultsDiv.innerHTML = `
                    <p>No match found!</p>
                    `;
                }
                
            } else if (data.message) {
                searchResultsDiv.innerHTML = `<p>${data.message}</p>`;
            }
        })
        .catch(error => {
            console.error('Error:', error); // Handle errors
        });
    });

    // Handle adding input fields for Search Form
    const addSearchInputBtn = document.getElementById('addSearchInputBtn');
    const searchUrlInputContainer = document.getElementById('searchUrlInputContainer');

    addSearchInputBtn.addEventListener('click', function () {
        const newFieldDiv = document.createElement('div');
        newFieldDiv.classList.add('control');
        newFieldDiv.style.marginTop = '10px';

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = "X";
        deleteBtn.classList.add("delete-btn");
        deleteBtn.addEventListener('click', () => {
            newFieldDiv.remove();
        })

        newFieldDiv.innerHTML = `
                <input class="input" type="text" name="starting_links[]" placeholder="Enter a URL defining the search range...">
            `;
        newFieldDiv.appendChild(deleteBtn);
        searchUrlInputContainer.appendChild(newFieldDiv);
    });
</script>
{% endblock %}
