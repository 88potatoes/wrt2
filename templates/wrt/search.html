    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');

            function refreshAccessToken() {
                return fetch('/api/token/refresh/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        refresh: refreshToken  // Use the refresh token to get a new access token
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.access) {
                            console.log("New access token received:", data.access);
                            localStorage.setItem('access_token', data.access);
                            return data.access;
                        } else {
                            console.log("Failed to refresh token, redirecting to login...");
                            window.location.href = "/login";
                            throw new Error('Failed to refresh token');
                        }
                    })
                    .catch(error => {
                        console.error('Error refreshing token:', error);
                        window.location.href = "/login";
                        throw new Error('Error refreshing token');
                    });
            }

            // Function to validate the access token on page load
            function validateAccessToken() {
                if (!accessToken) {
                    console.log("No access token found. Redirecting to login...");
                    window.location.href = "/login";
                } else {
                    fetch('/api/search-page/', {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer ' + accessToken,
                            'Content-Type': 'application/json'
                        }
                    })
                        .then(response => {
                            if (response.status === 401) {
                                console.log("Token invalid or expired. Attempting to refresh...");
                                return refreshAccessToken().then(newAccessToken => {
                                    return fetch('/api/search-page/', {
                                        method: 'GET',
                                        headers: {
                                            'Authorization': 'Bearer ' + newAccessToken,
                                            'Content-Type': 'application/json'
                                        }
                                    });
                                });
                            } else if (!response.ok) {
                                console.log("Token validation failed, redirecting to login...");
                                window.location.href = "/login";
                            } else {
                                console.log("Access token is valid.");
                            }
                        })
                        .catch(error => {
                            console.error('Error verifying token:', error);
                            window.location.href = "/login";
                        });
                }
            }

            validateAccessToken();
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');

            // Function to refresh the access token
            function refreshAccessToken() {
                return fetch('/api/token/refresh/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        refresh: refreshToken  // Use the refresh token to get a new access token
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.access) {
                            console.log("New access token received:", data.access);
                            localStorage.setItem('access_token', data.access);
                            return data.access;
                        } else {
                            console.log("Failed to refresh token, redirecting to login...");
                            window.location.href = "/login";
                            throw new Error('Failed to refresh token');
                        }
                    })
                    .catch(error => {
                        console.error('Error refreshing token:', error);
                        window.location.href = "/login";
                        throw new Error('Error refreshing token');
                    });
            }

            // Handle SearchForm submission
            const searchForm = document.getElementById('searchForm');
            searchForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const formData = new FormData(searchForm);
                const searchText = formData.get('search_text');
                const startingLinks = formData.get('starting_links').split(/\s*[,\n]\s*/).filter(Boolean); // Convert input to a list
                // const jsonFilename = formData.get('json_filename');
                const jsonFilename = "testOutput";

                let accessToken = localStorage.getItem('access_token');

                // Function to submit search form data
                function submitSearchForm(token) {
                    return fetch('/api/search/', {
                        method: "POST",
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            search_text: searchText,
                            starting_links: startingLinks,
                            json_filename: jsonFilename
                        })
                    });
                }

                // Make the initial request
                submitSearchForm(accessToken)
                    .then(response => {
                        if (response.ok) {
                            console.log("Access token is valid. Processing response...");
                            return response.json();
                        } else if (response.status === 401) {
                            console.log("Access token is invalid or expired. Attempting to refresh...");
                            return refreshAccessToken().then(newAccessToken => {
                                console.log("Retrying request with new access token.");
                                return submitSearchForm(newAccessToken).then(retryResponse => {
                                    if (retryResponse.ok) {
                                        return retryResponse.json();
                                    } else {
                                        throw new Error('Retry failed.');
                                    }
                                });
                            });
                        } else {
                            throw new Error('Something went wrong with the request.');
                        }
                    })
                    .then(data => {
                        console.log("Data received from the server:", data);
                        const searchResultsDiv = document.getElementById('searchResults');

                    // <tbody id="resultsBody"> 
                    //     <!-- <tr>
                    //         <td>givenString</td>
                    //         <td>url</td>
                    //     </tr> -->

                        // clears previous results
                        searchResultsDiv.innerHTML = '';

                        if (data.links && data.links.length > 0) {
                            const resultsTitle = document.createElement('h2');
                            resultsTitle.classList.add('results');
                            resultsTitle.textContent = 'Results - Strings Matched';
                            searchResultsDiv.appendChild(resultsTitle);

                            const table = document.createElement('table');
                            table.classList.add('table is-bordered is-fullwidth is-hoverable');
                            table.innerHTML = `
                                <thead>
                                    <tr>
                                        <th>Matched String</th>
                                        <th>Page URL</th>
                                    </tr>

                                    <tr class="urlRange">
                                        <th colspan="2">Web Pages with URL Prefix "there should be a placeholder of the link here"</th>
                                    </tr>
                                </thead>
                            `;

                            const tableBody = document.createElement('tbody');

                            data.links.forEach(link => {
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${searchText}</td>
                                    <td><a href="${link}" target="_blank">${link}</a></td>
                                `;
                                tableBody.appendChild(row);
                            });

                            table.appendChild(tableBody);
                            searchResultsDiv.appendChild(table);
                        } else if (data.message) {
                            searchResultsDiv.innerHTML = `<p>${data.message}</p>`;
                        }

                        // if (data.links && data.links.length > 0) {
                        //     const resultsList = document.createElement('ul');
                        //     data.links.forEach(link => {
                        //         const listItem = document.createElement('li');
                        //         listItem.textContent = link;
                        //         resultsList.appendChild(listItem);
                        //     });
                        //     searchResultsDiv.appendChild(resultsList);
                        // } else if (data.message) {
                        //     searchResultsDiv.innerHTML = `<p>${data.message}</p>`;
                        // }
                    })
                    .catch(error => console.error('Error:', error));
            });

            // Handle CrawlForm submission
            const crawlForm = document.getElementById('crawlForm');
            crawlForm.addEventListener('submit', function (event) {
                event.preventDefault();  // Prevent the default form submission

                const formData = new FormData(crawlForm);
                const startingLinks = formData.get('starting_links').split(/\s*[,\n]\s*/).filter(Boolean); // Convert input to a list
                const jsonFilename = formData.get('json_filename');

                let accessToken = localStorage.getItem('access_token');  // Get the access token

                // Function to submit crawl form data
                function submitCrawlForm(token) {
                    return fetch('/api/crawl/', {
                        method: "POST",
                        headers: {
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            starting_links: startingLinks,
                            json_filename: jsonFilename
                        })
                    });
                }

                // Make the initial request
                submitCrawlForm(accessToken)
                    .then(response => {
                        if (response.ok) {
                            console.log("Access token is valid.");
                            return response.json();
                        } else if (response.status === 401) {
                            console.log("Access token is invalid or expired. Attempting to refresh...");
                            return refreshAccessToken().then(newAccessToken => {
                                console.log("Retrying request with new access token.");
                                return submitCrawlForm(newAccessToken).then(retryResponse => {
                                    if (retryResponse.ok) {
                                        return retryResponse.json();
                                    } else {
                                        throw new Error('Retry failed.');
                                    }
                                });
                            });
                        } else {
                            throw new Error('Something went wrong with the request.');
                        }
                    })
                    .then(data => {
                        console.log("Data received from the server:", data);
                        const crawlResultsDiv = document.getElementById('crawlResults');
                        crawlResultsDiv.innerHTML = '';

                        if (data.links && data.links.length > 0) {
                            const resultsList = document.createElement('ul');
                            data.links.forEach(link => {
                                const listItem = document.createElement('li');
                                listItem.textContent = link;
                                resultsList.appendChild(listItem);
                            });
                            crawlResultsDiv.appendChild(resultsList);
                        } else if (data.message) {
                            crawlResultsDiv.innerHTML = `<p>${data.message}</p>`;
                        }
                    })
                    .catch(error => console.error('Error:', error));
            });
        });
    </script>

    <script>
        function showTab(tabId) {
            var tabContents = document.getElementsByClassName("tab-content");
            for (var i = 0; i < tabContents.length; i++) {
                tabContents[i].style.display = "none";
            }
            document.getElementById(tabId).style.display = "block";

            var tabLinks = document.querySelectorAll(".tabs-is-centered ul li");
            tabLinks.forEach(function (link) {
                link.classList.remove("is-active");
            });
            document.querySelector(`.tabs-is-centered ul li a[onclick="showTab('${tabId}')"]`).parentNode.classList.add("is-active");
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const logoutLink = document.getElementById('logoutLink');

            logoutLink.addEventListener('click', function (event) {
                event.preventDefault();

                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');

                console.log('Logged out, tokens cleared.');

                window.location.href = '/login';
            });
        });
    </script>

</body>
