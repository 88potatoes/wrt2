<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item">Home</a>
                <a href="/about" class="navbar-item" style="color: #58a1ef; font-weight: bold;">About Us</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'search' %}" class="navbar-item">Search</a>
                {% else %}
                    <a href="{% url 'login' %}?next={% url 'search' %}" class="navbar-item">Search</a>
                {% endif %}
            </div>
            <div class="navbar-end">
                {% if user.is_authenticated %}
                    <a href="/logout" class="navbar-item">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}?next={% url 'about' %}" class="navbar-item">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container has-text-centered">
            <h1 class="title">So this is us lmao</h1>
        </div>
    </section>

</body>
</html>
