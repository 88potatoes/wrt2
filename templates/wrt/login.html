<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-menu">
            <div class="navbar-start">
                <a href="/" class="navbar-item">Home</a>
                <a href="/about" class="navbar-item">About Us</a>
                <a href="api/search-page/" class="navbar-item">Search</a>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h1 class="title-has-text-centered">Login</h1>
            <div class="columns is-centered">
                <div class="column is-4">
                    <form id="loginForm">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">

                        <div class="field">
                            <label class="label">Username</label>
                            <div class="control">
                                <input class="input" type="text" name="username" placeholder="Username" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Password</label>
                            <div class="control">
                                <input class="input" type="password" name="password" placeholder="Password" required>
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-link" type="submit">Login</button>
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <div id="errorMessage" class="has-text-danger"></div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Handle the form submission using AJAX
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const username = document.querySelector('input[name="username"]').value;
            const password = document.querySelector('input[name="password"]').value;

            // Send login request to /api/token/ to get JWT tokens
            fetch("/api/token/", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ username: username, password: password })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Login failed. Please check your credentials.');
                    }
                    return response.json();
                })
                .then(data => {
                    // Store the access and refresh tokens
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);

                    const nextUrl = "/api/search-page/";
                    window.location.href = nextUrl;
                })
                .catch(error => {
                    // Display error message to the user
                    document.getElementById('errorMessage').textContent = error.message;
                    console.error('Error:', error);
                });
        });
    </script>

</body>

</html>
