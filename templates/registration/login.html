{% extends "base.html" %}
{% load static %}

{% block title %} Login {% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-4">
                <form id="loginForm" method="post">
                    {% csrf_token %}
                    <h1 class="title-has-text-centered">Login</h1>
                    <input type="hidden" name="next" value="{{ request.GET.next|default_if_none:'' }}">

                    {% if form.non_field_errors %}
                    <div class="notification is-danger">
                        {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}
                    <div class="field">
                        <label class="label" for="username">Username</label>
                        <input id="username" class="input" type="text" name="username" placeholder="Username" required>
                    </div>

                    <div class="field">
                        <label class="label" for="password">Password</label>
                        <div class="control">
                            <input id="password" class="input" type="password" name="password" placeholder="Password"
                                required>
                        </div>
                    </div>


                    <div class="field">
                        <div class="control">
                            <button class="button is-link" type="submit">Login</button>
                            <a href="{% url 'create_user' %}">

                                <button class="button is-link" type="button" id="create-user-button">Create User</button>
                                </a>
                        </div>
                    </div>

                </form>
            </div>
        </div>
</section>
{% endblock %}
