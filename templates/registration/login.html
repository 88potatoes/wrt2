{% extends "base.html" %}
{% load static %}

{% block title %} Login {% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<!-- <script src="{% static '/js/login.js' %}"></script> -->
{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-4">
                <form id="loginForm" method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <h1 class="title-has-text-centered">Login</h1>
                    <input type="hidden" name="next" value="{{ request.GET.next|default_if_none:'' }}">

                    {% if form.non_field_errors %}
                    <div class="notification is-danger">
                        {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="field">
                        <label class="label" for="{{ form.username.id_for_label }}"">Username</label>
                            <input id=" {{ form.username.id_for_label }}" class="input" type="text" name="username"
                            placeholder="Username" value="{{ form.username.value|default_if_none:'' }}">
                    </div>

                    <div class="field">
                        <label class="label" for="{{ form.password.id_for_label }}">Password</label>
                        <div class="control">
                            <input class="input" type="password" name="password" id="{{ form.password.id_for_label }}"
                                placeholder="Password" required>
                        </div>
                    </div>

                    <div class="field">
                        <div class="control">
                            <button class="button is-link" type="submit" id="login-button">Login</button>
                            <button class="button is-link" type="button" id="create-user-button">Create
                                User</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const createUserButton = document.getElementById("create-user-button");

        createUserButton.addEventListener("click", function () {
            console.log("Create User button clicked");
            window.location.href = "/create_user";
        });
    });
</script>
{% endblock %}
