name: Lint with Flake8

on:
  push:
    branches:
      - main  # Change this to the branch you want to check
  pull_request:
    branches:
      - main  # Change this to the branch you want to check

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Change this to your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Add any other dependencies here, e.g., pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 your_package_or_module  # Change this to your package or module path
