name: Django CI

env:
  DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  flake8:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v2
          with:
            python-version: '3.12'  # Change this to your preferred Python version

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install flake8
            # Add any other dependencies here, e.g., pip install -r requirements.txt

        - name: Run Flake8
          run: |
            pwd
            flake8 wrt2
  build:

    runs-on: ubuntu-latest
    env: # runs test inside the container
      USE_TURSO_DATABASE: False
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Generate DJANGO_SECRET_KEY
      run: |
        echo "DJANGO_SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> $GITHUB_ENV

    - name: Run Tests
      run: |
        python manage.py test
